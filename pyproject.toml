[project]
name = "fiken-mcp"
version = "0.1.0"
description = "MCP server for Fiken REST API v2 — Bringsvor Consulting AS"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiken_mcp"]

[project.scripts]
fiken-mcp = "fiken_mcp.server:main"
