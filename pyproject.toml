[project]
name = "fiken-mcp"
version = "0.1.0"
description = "MCP server for Fiken REST API v2"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/fiken_mcp"]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]

[project.scripts]
fiken-mcp = "fiken_mcp.server:main"
fiken-auth = "fiken_mcp.auth:main"
